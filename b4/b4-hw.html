<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      input[type="text"] {
        padding: 8px;
        width: 200px;
        margin-right: 10px;
      }
      button {
        padding: 8px 12px;
        margin: 0 5px;
        cursor: pointer;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid #ddd;
        margin: 5px 0;
      }
      .edit-btn {
        background-color: #4caf50;
        color: white;
      }
      .delete-btn {
        background-color: #f44336;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Task Tracker</h1>
    <div>
      <input type="text" id="newTaskInput" placeholder="New task" />
      <button onclick="addTask()">Add Task</button>
    </div>
    <ul id="taskList"></ul>

    <script>
      // 1. Tạo mảng để lưu trữ các đối tượng task (mỗi task có id và name/title)
      let tasks = [
        { id: 1, name: "Do homework" },
        { id: 2, name: "Code projects" },
      ];

      // Hàm render danh sách tasks lên DOM (Read - hiển thị dữ liệu)
      function renderTasks() {
        const taskList = document.getElementById("taskList");
        taskList.innerHTML = ""; // Xóa danh sách cũ

        tasks.forEach((task) => {
          const li = document.createElement("li");
          li.innerHTML = `
                    <span>${task.name}</span>
                    <div>
                        <button class="edit-btn" onclick="editTask(${task.id})">Edit</button>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;
          taskList.appendChild(li);
        });
      }

      // 2. Create - Thêm task mới
      function addTask() {
        const input = document.getElementById("newTaskInput");
        const newName = input.value.trim();
        if (newName === "") return; // Không thêm nếu rỗng

        const newId =
          tasks.length > 0 ? Math.max(...tasks.map((t) => t.id)) + 1 : 1;
        tasks.push({ id: newId, name: newName });
        input.value = ""; // Xóa input
        renderTasks(); // Cập nhật hiển thị
      }

      // 3. Update - Chỉnh sửa task (sử dụng prompt để đơn giản)
      function editTask(id) {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;

        const newName = prompt("Edit task:", task.name);
        if (newName !== null && newName.trim() !== "") {
          task.name = newName.trim();
          renderTasks(); // Cập nhật hiển thị
        }
      }

      // 4. Delete - Xóa task
      function deleteTask(id) {
        if (confirm("Are you sure you want to delete this task?")) {
          tasks = tasks.filter((t) => t.id !== id);
          renderTasks(); // Cập nhật hiển thị
        }
      }

      // Khởi tạo: Hiển thị danh sách ban đầu khi load trang
      renderTasks();

      // Thêm sự kiện Enter để add task khi nhấn phím
      document
        .getElementById("newTaskInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            addTask();
          }
        });
    </script>
  </body>
</html>
