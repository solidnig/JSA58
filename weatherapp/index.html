<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weather App - Dự báo thời tiết</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="weather-card">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="brand">Weather App</div>
          <div class="small-note">
            Nhập tên thành phố hoặc dùng vị trí thiết bị
          </div>
        </div>
        <div id="timeNow" class="muted small-note"></div>
      </div>

      <div class="input-row">
        <div class="input-group">
          <input
            id="cityInput"
            type="text"
            class="form-control"
            placeholder="Enter city name (ví dụ: Hanoi)"
          />
          <button id="searchBtn" class="btn btn-primary">Search</button>
        </div>

        <div class="divider">
          <div class="or-line"></div>
          <div class="small-note">or</div>
          <div class="or-line"></div>
        </div>

        <div class="d-grid gap-2">
          <button id="locBtn" class="btn btn-outline-primary">
            Get Device Location
          </button>
        </div>
      </div>

      <div id="message" class="mt-3 small-note"></div>

      <div id="result" class="result d-none">
        <div class="d-flex align-items-center">
          <img id="icon" src="" alt="weather icon" class="weather-icon me-3" />
          <div>
            <h4 id="cityName" class="mb-0"></h4>
            <div id="desc" class="muted small-note"></div>
          </div>
        </div>

        <hr />

        <div class="row text-center">
          <div class="col-6 col-md-3 mb-2">
            <div class="muted small-note">Nhiệt độ</div>
            <div id="temp" class="h4 mb-0"></div>
          </div>
          <div class="col-6 col-md-3 mb-2">
            <div class="muted small-note">Cảm giác</div>
            <div id="feels" class="h5 mb-0"></div>
          </div>
          <div class="col-6 col-md-3 mb-2">
            <div class="muted small-note">Độ ẩm</div>
            <div id="humidity" class="h5 mb-0"></div>
          </div>
          <div class="col-6 col-md-3 mb-2">
            <div class="muted small-note">Gió</div>
            <div id="wind" class="h5 mb-0"></div>
          </div>
        </div>

        <div class="mt-3 small-note text-end" id="metaInfo"></div>
      </div>

      <footer class="small-note text-center mt-3">
        Dữ liệu từ OpenWeatherMap • Đơn vị: °C
      </footer>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
