<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/mailtoharshit/San-Francisco-Font-/sanfrancisco.css"
    />
    <link rel="stylesheet" href="./font-awesome-6.5.1-pro-full/css/all.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  </head>

  <body>
    <header>
      <h1>Mind<span>X</span> Cinema</h1>
      <div class="header-icon">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-user"></i>
      </div>
    </header>
    <div class="hero-section">
      <img
        class="bg-img"
        src="https://image.tmdb.org/t/p/original/k6tdiMTO39RQj3dhfspuzprfoe0.jpg"
        alt=""
      />
      <div class="hero-section-width">
        <div class="hero-section-info">
          <h1>Chainsaw Man - The Movie: Reze Arc</h1>
          <p>
            In a brutal war between devils, hunters, and secret enemies, a
            mysterious girl named Reze has stepped into Denji's world, and he
            faces his deadliest battle yet, fueled by love in a world where
            survival knows no rules.
          </p>
          <div class="">
            <button class="btn btn-primary me-3">
              <i class="fa-light fa-circle-play me-2"></i> Watch now
            </button>
            <button class="btn btn-primary">
              <i class="fa-light fa-circle-info me-2"></i>View info
            </button>
          </div>
        </div>
        <div class="hero-preview-img">
          <img
            src="https://image.tmdb.org/t/p/w300/xdzLBZjCVSEsic7m7nJc4jNJZVW.jpg"
            alt=""
          />
        </div>
      </div>
    </div>
    <div class="section-trending-movie swiper">
      <h1>Trending Movies</h1>
      <div class="movies swiper-wrapper"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
    <main></main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>

    <script>
      const swiper = new Swiper(".swiper", {
        // Optional parameters
        direction: "horizontal",
        loop: true,
        slidesPerView: 8,

        // If we need pagination
        pagination: {
          el: ".swiper-pagination",
        },

        // Navigation arrows
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },

        // And if we need scrollbar
        scrollbar: {
          el: ".swiper-scrollbar",
        },
      });
    </script>
    <script src="app.js"></script>
  </body>
</html>
