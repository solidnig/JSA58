<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindX Cinema - Đăng Nhập & Đăng Ký</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #000;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: linear-gradient(to bottom, #141414, #000);
        padding: 60px 40px;
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        max-width: 800px;
        width: 100%;
        text-align: center;
      }

      .logo {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #e50914;
      }

      #authSection {
        display: block;
      }

      #mainContent {
        display: none;
      }

      .form-container {
        display: none;
      }

      .form-container.active {
        display: block;
      }

      h2 {
        margin: 0 0 20px;
        font-size: 24px;
      }

      .input-group {
        margin-bottom: 15px;
        text-align: left;
        position: relative;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      input[type="text"],
      input[type="password"],
      input[type="email"],
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        background-color: #333;
        color: #fff;
        font-size: 16px;
        box-sizing: border-box;
      }

      textarea {
        min-height: 60px;
        resize: vertical;
      }

      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="email"]:focus,
      select:focus,
      textarea:focus {
        outline: none;
        background-color: #444;
      }

      .error-message {
        color: #e50914;
        font-size: 12px;
        margin-top: 5px;
        min-height: 16px;
        text-align: left;
      }

      .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #e50914;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 15px;
      }

      .submit-btn:hover:not(:disabled) {
        background-color: #f40612;
      }

      .submit-btn:disabled {
        background-color: #666;
        cursor: not-allowed;
      }

      .toggle-link {
        color: #b3b3b3;
        text-decoration: underline;
        cursor: pointer;
        font-size: 14px;
      }

      .toggle-link:hover {
        color: #fff;
      }

      .help-text {
        font-size: 12px;
        color: #b3b3b3;
        margin-top: 10px;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-size: 14px;
      }

      .checkbox-group input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
      }

      .new-user {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #333;
        font-size: 14px;
      }

      .input-error {
        border-color: #e50914 !important;
        background-color: #4a0000;
      }

      .movie-item {
        background-color: #333;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .movie-item:hover {
        background-color: #444;
      }

      .movie-item span {
        flex-grow: 1;
      }

      .movie-item button {
        padding: 5px 10px;
        background: #e50914;
        color: #fff;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        margin-left: 5px;
        font-size: 12px;
      }

      .movie-item button:hover {
        background: #f40612;
      }

      #movieDetails {
        background-color: #333;
        padding: 20px;
        border-radius: 4px;
        margin-top: 20px;
        text-align: left;
      }

      .page-switch {
        margin-bottom: 20px;
      }

      .page-switch button {
        margin: 0 10px;
        padding: 10px 20px;
        background-color: #e50914;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .page-switch button:hover {
        background-color: #f40612;
      }

      .page-section {
        display: none;
      }

      .page-section.active {
        display: block;
      }

      #logoutBtn {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #666;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      #logoutBtn:hover {
        background-color: #555;
      }

      .welcome {
        margin-bottom: 20px;
        font-size: 18px;
      }

      .edit-btn {
        padding: 10px 20px;
        background-color: #e50914;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
      }

      .edit-btn:hover {
        background-color: #f40612;
      }

      .movie-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background: #333;
        padding: 20px;
        border-radius: 4px;
        max-width: 400px;
        width: 90%;
      }

      .modal-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
      }

      .modal-buttons button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .modal-save {
        background: #e50914;
        color: #fff;
      }

      .modal-cancel {
        background: #666;
        color: #fff;
      }

      #methodDiv {
        margin-bottom: 15px;
      }

      #methodDiv label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">MindX Cinema</div>

      <div id="authSection">
        <!-- Form Đăng Nhập -->
        <div id="loginForm" class="form-container active">
          <h2>Đăng Nhập</h2>
          <form id="loginFormElement">
            <div class="input-group">
              <label for="loginUsername">Tên đăng nhập</label>
              <input type="text" id="loginUsername" name="username" required />
              <div class="error-message" id="loginUsernameError"></div>
            </div>
            <div class="input-group">
              <label for="loginPassword">Mật khẩu</label>
              <input
                type="password"
                id="loginPassword"
                name="password"
                required
              />
              <div class="error-message" id="loginPasswordError"></div>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="rememberMe" />
              <label for="rememberMe">Nhớ đăng nhập</label>
            </div>
            <div id="methodDiv">
              <label for="storageMethod">Phương thức lưu nhớ:</label>
              <select id="storageMethod">
                <option value="local">LocalStorage</option>
                <option value="cookie">Cookie</option>
              </select>
            </div>
            <button type="submit" class="submit-btn" id="loginSubmit">
              Đăng Nhập
            </button>
            <div class="help-text">
              Cần giúp đỡ? <a href="#" style="color: #b3b3b3">Liên hệ hỗ trợ</a>
            </div>
          </form>
          <div class="new-user">
            <p>
              Bạn chưa có tài khoản?
              <span class="toggle-link" onclick="toggleForm('signup')"
                >Đăng ký ngay</span
              >
            </p>
          </div>
        </div>

        <!-- Form Đăng Ký -->
        <div id="signupForm" class="form-container">
          <h2>Đăng Ký</h2>
          <form id="signupFormElement">
            <div class="input-group">
              <label for="signupUsername">Tên đăng nhập</label>
              <input type="text" id="signupUsername" name="username" required />
              <div class="error-message" id="signupUsernameError"></div>
            </div>
            <div class="input-group">
              <label for="signupEmail">Email</label>
              <input type="email" id="signupEmail" name="email" required />
              <div class="error-message" id="signupEmailError"></div>
            </div>
            <div class="input-group">
              <label for="signupPassword">Mật khẩu</label>
              <input
                type="password"
                id="signupPassword"
                name="password"
                required
              />
              <div class="error-message" id="signupPasswordError"></div>
            </div>
            <div class="input-group">
              <label for="signupVerifyPassword">Xác nhận mật khẩu</label>
              <input
                type="password"
                id="signupVerifyPassword"
                name="verifyPassword"
                required
              />
              <div class="error-message" id="signupVerifyPasswordError"></div>
            </div>
            <button type="submit" class="submit-btn" id="signupSubmit">
              Đăng Ký
            </button>
            <div class="help-text">
              Đã có tài khoản?
              <span class="toggle-link" onclick="toggleForm('login')"
                >Đăng nhập</span
              >
            </div>
          </form>
        </div>
      </div>

      <div id="mainContent">
        <div class="welcome" id="welcomeMsg">
          Chào mừng, <span id="currentUser"></span>!
        </div>
        <div class="page-switch">
          <button onclick="switchPage('customer')">Trang Khách Hàng</button>
          <button onclick="switchPage('admin')">Trang Quản Lý</button>
        </div>
        <div id="customerPage" class="page-section active">
          <h2>Danh Sách Phim</h2>
          <button
            id="customerEditBtn"
            class="edit-btn"
            onclick="toggleEditMode('customer')"
          >
            Chỉnh Sửa Phim
          </button>
          <div id="movieList"></div>
        </div>
        <div id="adminPage" class="page-section">
          <h2>Quản Lý Phim</h2>
          <button
            id="adminEditBtn"
            class="edit-btn"
            onclick="toggleEditMode('admin')"
          >
            Chỉnh Sửa Phim
          </button>
          <div id="adminMovieList"></div>
        </div>
        <div id="movieDetails" style="display: none">
          <h3 id="detailTitle"></h3>
          <p id="detailDesc"></p>
          <button class="submit-btn" onclick="hideDetails()">Đóng</button>
        </div>
        <button id="logoutBtn" onclick="logout()">Đăng Xuất</button>
      </div>

      <!-- Modal for Add/Edit Movie -->
      <div id="movieModal" class="movie-modal">
        <div class="modal-content">
          <h3 id="modalTitle">Thêm Phim</h3>
          <form id="modalForm">
            <input type="hidden" id="editId" />
            <div class="input-group">
              <label for="modalTitleInput">Tiêu đề</label>
              <input type="text" id="modalTitleInput" required />
            </div>
            <div class="input-group">
              <label for="modalDescInput">Mô tả</label>
              <textarea id="modalDescInput" required></textarea>
            </div>
            <div class="modal-buttons">
              <button type="submit" class="modal-save">Lưu</button>
              <button type="button" class="modal-cancel" onclick="closeModal()">
                Hủy
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      let movies = JSON.parse(localStorage.getItem("movies") || "[]");
      let customerEditMode = false;
      let adminEditMode = false;

      if (movies.length === 0) {
        movies = [
          {
            id: 1,
            title: "Extraction 2",
            desc: "Phim hành động hấp dẫn về đặc vụ cứu con tin.",
          },
          {
            id: 2,
            title: "Black Clover",
            desc: "Bộ phim anime về cậu bé ma thuật.",
          },
          { id: 3, title: "Peaky Blinders", desc: "Phim tội phạm Anh quốc." },
          {
            id: 4,
            title: "Wednesday",
            desc: "Phim kinh dị hài về cô bé Addams.",
          },
        ];
        localStorage.setItem("movies", JSON.stringify(movies));
      }

      function saveMovies() {
        localStorage.setItem("movies", JSON.stringify(movies));
      }

      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === " ") c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0)
            return c.substring(nameEQ.length, c.length);
        }
        return null;
      }

      function setRemember(user, method) {
        if (method === "local") {
          localStorage.setItem("rememberedUser", user);
          localStorage.setItem("rememberMethod", method);
          document.cookie = `rememberedUser=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
          document.cookie = `rememberMethod=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        } else if (method === "cookie") {
          document.cookie = `rememberedUser=${encodeURIComponent(
            user
          )}; max-age=${30 * 24 * 60 * 60}; path=/;`;
          document.cookie = `rememberMethod=${method}; max-age=${
            30 * 24 * 60 * 60
          }; path=/;`;
          localStorage.removeItem("rememberedUser");
          localStorage.removeItem("rememberMethod");
        }
      }

      function getRemembered() {
        let user = localStorage.getItem("rememberedUser");
        if (user && localStorage.getItem("rememberMethod") === "local") {
          return user;
        }
        user = getCookie("rememberedUser");
        if (user && getCookie("rememberMethod") === "cookie") {
          return decodeURIComponent(user);
        }
        return null;
      }

      function toggleForm(formType) {
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        clearErrors("login");
        clearErrors("signup");

        if (formType === "login") {
          loginForm.classList.add("active");
          signupForm.classList.remove("active");
          setupLoginForm();
        } else {
          signupForm.classList.add("active");
          loginForm.classList.remove("active");
        }
      }

      function clearErrors(formType) {
        const errors = document.querySelectorAll(
          `#${formType}Form .error-message`
        );
        errors.forEach((error) => (error.textContent = ""));
        const inputs = document.querySelectorAll(`#${formType}Form input`);
        inputs.forEach((input) => input.classList.remove("input-error"));
      }

      function showError(inputId, errorId, message) {
        const errorEl = document.getElementById(errorId);
        const inputEl = document.getElementById(inputId);
        errorEl.textContent = message;
        inputEl.classList.add("input-error");
      }

      function getUsers() {
        return JSON.parse(localStorage.getItem("users") || "[]");
      }

      function saveUsers(users) {
        localStorage.setItem("users", JSON.stringify(users));
      }

      function setupLoginForm() {
        const remembered = getRemembered();
        const loginUsername = document.getElementById("loginUsername");
        const rememberMe = document.getElementById("rememberMe");
        const methodDiv = document.getElementById("methodDiv");
        const storageMethod = document.getElementById("storageMethod");

        if (remembered) {
          loginUsername.value = remembered;
          rememberMe.checked = true;
          methodDiv.style.display = "block";
          const localMethod = localStorage.getItem("rememberMethod");
          if (localMethod === "local") {
            storageMethod.value = "local";
          } else {
            const cookieMethod = getCookie("rememberMethod");
            if (cookieMethod === "cookie") {
              storageMethod.value = "cookie";
            }
          }
        } else {
          methodDiv.style.display = "none";
        }

        rememberMe.addEventListener("change", function () {
          methodDiv.style.display = this.checked ? "block" : "none";
        });
      }

      function validateLogin() {
        clearErrors("login");
        let isValid = true;

        const username = document.getElementById("loginUsername").value.trim();
        if (!username) {
          showError(
            "loginUsername",
            "loginUsernameError",
            "Tên đăng nhập là bắt buộc."
          );
          isValid = false;
        }

        const password = document.getElementById("loginPassword").value.trim();
        if (!password) {
          showError(
            "loginPassword",
            "loginPasswordError",
            "Mật khẩu là bắt buộc."
          );
          isValid = false;
        }

        if (isValid) {
          const users = getUsers();
          const user = users.find(
            (u) => u.username === username && u.password === password
          );
          if (!user) {
            showError(
              "loginPassword",
              "loginPasswordError",
              "Thông tin đăng nhập không hợp lệ."
            );
            isValid = false;
          }
        }

        return isValid;
      }

      function validateSignup() {
        clearErrors("signup");
        let isValid = true;

        const username = document.getElementById("signupUsername").value.trim();
        if (username.length < 6 || username.length > 18) {
          showError(
            "signupUsername",
            "signupUsernameError",
            "Tên đăng nhập phải từ 6 đến 18 ký tự."
          );
          isValid = false;
        }

        const email = document.getElementById("signupEmail").value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showError(
            "signupEmail",
            "signupEmailError",
            "Email phải đúng định dạng."
          );
          isValid = false;
        }

        const password = document.getElementById("signupPassword").value.trim();
        if (password.length < 8 || password.length > 20) {
          showError(
            "signupPassword",
            "signupPasswordError",
            "Mật khẩu phải từ 8 đến 20 ký tự."
          );
          isValid = false;
        }

        const verifyPassword = document
          .getElementById("signupVerifyPassword")
          .value.trim();
        if (verifyPassword !== password) {
          showError(
            "signupVerifyPassword",
            "signupVerifyPasswordError",
            "Xác nhận mật khẩu phải trùng khớp."
          );
          isValid = false;
        }

        if (isValid) {
          const users = getUsers();
          if (users.find((u) => u.username === username)) {
            showError(
              "signupUsername",
              "signupUsernameError",
              "Tên đăng nhập đã tồn tại."
            );
            isValid = false;
          }
        }

        return isValid;
      }

      function loginSuccess(username) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", username);
        const rememberMe = document.getElementById("rememberMe").checked;
        if (rememberMe) {
          const method = document.getElementById("storageMethod").value;
          setRemember(username, method);
        }
        showMain();
      }

      function signupSuccess(username) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", username);
        setRemember(username, "local"); // Default to local after signup
        showMain();
      }

      function showMain() {
        const currentUser = localStorage.getItem("currentUser");
        document.getElementById("currentUser").textContent = currentUser;
        document.getElementById("authSection").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        renderMovies();
        switchPage("customer");
      }

      function renderSection(section, editMode) {
        const listId = section === "customer" ? "movieList" : "adminMovieList";
        const list = document.getElementById(listId);
        let html = movies
          .map((movie) => {
            const onclick = editMode
              ? ""
              : `onclick="showDetails(${movie.id})"`;
            let item = `<div class="movie-item" ${onclick}>`;
            item += `<span>${movie.title}</span>`;
            if (editMode) {
              item += ` <button onclick="editMovie(${movie.id}); event.stopPropagation(); return false;">Sửa</button>`;
              item += ` <button onclick="deleteMovie(${movie.id}); event.stopPropagation(); return false;">Xóa</button>`;
            }
            item += "</div>";
            return item;
          })
          .join("");
        list.innerHTML = html;
      }

      function renderMovies() {
        renderSection("customer", customerEditMode);
        renderSection("admin", adminEditMode);
      }

      function showDetails(id) {
        const movie = movies.find((m) => m.id === id);
        if (movie) {
          document.getElementById("detailTitle").textContent = movie.title;
          document.getElementById("detailDesc").textContent = movie.desc;
          document.getElementById("movieDetails").style.display = "block";
        }
      }

      function hideDetails() {
        document.getElementById("movieDetails").style.display = "none";
      }

      function toggleEditMode(type) {
        if (type === "customer") {
          customerEditMode = !customerEditMode;
          const btn = document.getElementById("customerEditBtn");
          btn.textContent = customerEditMode
            ? "Hủy Chỉnh Sửa"
            : "Chỉnh Sửa Phim";
          renderSection("customer", customerEditMode);
        } else {
          adminEditMode = !adminEditMode;
          const btn = document.getElementById("adminEditBtn");
          btn.textContent = adminEditMode ? "Hủy Chỉnh Sửa" : "Chỉnh Sửa Phim";
          renderSection("admin", adminEditMode);
        }
      }

      function editMovie(id) {
        const movie = movies.find((m) => m.id === parseInt(id));
        if (movie) {
          openModal(movie);
        }
      }

      function deleteMovie(id) {
        if (confirm("Bạn có chắc muốn xóa phim này?")) {
          movies = movies.filter((m) => m.id !== parseInt(id));
          saveMovies();
          renderMovies();
        }
      }

      function openModal(movie = null) {
        const modalTitle = document.getElementById("modalTitle");
        const editId = document.getElementById("editId");
        const titleInput = document.getElementById("modalTitleInput");
        const descInput = document.getElementById("modalDescInput");

        if (movie) {
          modalTitle.textContent = "Chỉnh Sửa Phim";
          editId.value = movie.id;
          titleInput.value = movie.title;
          descInput.value = movie.desc;
        } else {
          modalTitle.textContent = "Thêm Phim";
          editId.value = "";
          titleInput.value = "";
          descInput.value = "";
        }
        document.getElementById("movieModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("movieModal").style.display = "none";
      }

      function switchPage(type) {
        const customerPage = document.getElementById("customerPage");
        const adminPage = document.getElementById("adminPage");
        if (type === "customer") {
          customerPage.classList.add("active");
          adminPage.classList.remove("active");
        } else {
          adminPage.classList.add("active");
          customerPage.classList.remove("active");
        }
        renderMovies(); // Re-render to ensure current modes
      }

      function logout() {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("currentUser");
        localStorage.removeItem("rememberedUser");
        localStorage.removeItem("rememberMethod");
        document.cookie = `rememberedUser=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        document.cookie = `rememberMethod=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        document.getElementById("authSection").style.display = "block";
        document.getElementById("mainContent").style.display = "none";
        toggleForm("login");
        setupLoginForm();
        customerEditMode = false;
        adminEditMode = false;
        document.getElementById("customerEditBtn").textContent =

      // Event listeners
      document
        .getElementById("loginFormElement")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          if (validateLogin()) {
            const username = document
              .getElementById("loginUsername")
              .value.trim();
            loginSuccess(username);
          }
        });

      document
        .getElementById("signupFormElement")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          if (validateSignup()) {
            const username = document
              .getElementById("signupUsername")
              .value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document
              .getElementById("signupPassword")
              .value.trim();
            const users = getUsers();
            users.push({ username, email, password });
            saveUsers(users);
            signupSuccess(username);
          }
        });

      document
        .getElementById("modalForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const id = document.getElementById("editId").value;
          const title = document.getElementById("modalTitleInput").value.trim();
          const desc = document.getElementById("modalDescInput").value.trim();
          if (!title || !desc) {
            alert("Vui lòng điền đầy đủ thông tin.");
            return;
          }
          if (id) {
            const movie = movies.find((m) => m.id == id);
            if (movie) {
              movie.title = title;
              movie.desc = desc;
            }
          } else {
            const newId = movies.length
              ? Math.max(...movies.map((m) => m.id)) + 1
              : 1;
            movies.push({ id: newId, title, desc });
          }
          saveMovies();
          closeModal();
          renderMovies();
        });
